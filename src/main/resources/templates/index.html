<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flash Troubleshooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* scrollbar for chat pane */
        .chat-scroll::-webkit-scrollbar { height: 8px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 999px; }
    </style>
</head>
<body class="bg-purple-50 min-h-screen font-sans">
<div class="max-w-2xl mx-auto h-screen flex flex-col">
    <!-- Top bar -->
    <header class="bg-white/60 backdrop-blur-sm border-b border-purple-100 p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="text-2xl">⚡</div>
            <div class="text-lg font-semibold">Flash Troubleshooter</div>
        </div>
        <div class="text-sm text-gray-600">Tree: <span th:text="${activeTree}">default</span></div>
    </header>

    <!-- Chat area -->
    <main class="flex-1 overflow-hidden p-4">
        <div class="h-full bg-white rounded-3xl shadow-inner p-4 flex flex-col">
            <div class="flex-1 overflow-auto chat-scroll p-2" id="chatPane">
                <!-- If not started show welcome card + dropdown -->
                <div th:if="${!isStarted}" class="mt-8">
                    <div class="bg-white rounded-2xl p-6 shadow-md">
                        <h2 class="text-xl font-semibold mb-2">Welcome — choose an issue to start</h2>
                        <p class="text-sm text-gray-600 mb-4">Select from common troubleshooting trees.</p>
                        <form th:action="@{/start}" method="post" class="flex gap-3">
                            <select name="treeName" required class="flex-1 rounded-2xl p-3 bg-purple-50 focus:outline-none focus:ring-2 focus:ring-purple-300">
                                <option th:each="t : ${availableTrees}" th:value="${t}" th:text="${t}"></option>
                            </select>
                            <button class="bg-emerald-200 text-emerald-800 px-4 py-2 rounded-2xl font-semibold">Start</button>
                        </form>
                    </div>
                </div>

                <!-- If started show current node as a single message -->
                <div th:if="${isStarted}">
                    <div class="mt-6">
                        <div class="max-w-[85%] bg-emerald-100 text-emerald-900 rounded-2xl p-4 mb-4 shadow-sm">
                            <div class="text-sm font-medium">System</div>
                            <div class="mt-2 text-lg" th:text="${node.text}">Question text</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Input / Keyboard area -->
    <footer class="bg-transparent p-4">
        <div class="max-w-2xl mx-auto">
            <!-- Single interaction zone -->
            <div class="bg-white rounded-2xl p-4 shadow-lg">
                <!-- If not started: show dropdown (also available above) -->
                <div th:if="${!isStarted}">
                    <form th:action="@{/start}" method="post" class="flex gap-3">
                        <select name="treeName" required class="flex-1 rounded-2xl p-3 bg-purple-50 focus:outline-none focus:ring-2 focus:ring-purple-300">
                            <option th:each="t : ${availableTrees}" th:value="${t}" th:text="${t}"></option>
                        </select>
                        <button class="bg-emerald-300 text-emerald-800 px-4 py-2 rounded-2xl font-semibold">Start</button>
                    </form>
                </div>

                <!-- If question: show YES/NO buttons -->
                <div th:if="${isStarted} and ${isQuestion}" class="flex gap-3 justify-center">
                    <form th:action="@{/decision}" method="post" class="flex-1">
                        <input type="hidden" name="decision" value="yes"/>
                        <button class="w-full bg-emerald-200 text-emerald-900 py-3 rounded-2xl font-bold">YES</button>
                    </form>
                    <form th:action="@{/decision}" method="post" class="flex-1">
                        <input type="hidden" name="decision" value="no"/>
                        <button class="w-full bg-pink-100 text-pink-700 py-3 rounded-2xl font-bold">NO</button>
                    </form>
                </div>

                <!-- If solution: show Restart and admin expand toggle -->
                <div th:if="${isStarted} and ${isSolution}" class="space-y-3">
                    <div class="flex gap-3">
                        <a th:href="@{/restart}" class="flex-1 text-center bg-purple-200 text-purple-800 py-3 rounded-2xl font-semibold">Restart</a>
                        <button type="button" class="px-4 py-3 bg-white border rounded-2xl" data-bs-toggle="collapse" data-bs-target="#adminExpand">Improve</button>
                    </div>

                    <div id="adminExpand" class="mt-2 hidden">
                        <div class="bg-gray-50 p-4 rounded-2xl border">
                            <form th:action="@{/admin/expand}" method="post" class="space-y-3">
                                <input type="hidden" name="targetLeafId" th:value="${node.id}" />
                                <div>
                                    <label class="block text-sm text-gray-600">New Question</label>
                                    <input name="newQuestionText" required class="w-full rounded-2xl p-3 focus:ring-2 focus:ring-purple-300" />
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600">Yes Outcome</label>
                                    <input name="yesSolText" required class="w-full rounded-2xl p-3 focus:ring-2 focus:ring-purple-300" />
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600">No Outcome</label>
                                    <input name="noSolText" required class="w-full rounded-2xl p-3 focus:ring-2 focus:ring-purple-300" />
                                </div>
                                <div class="flex justify-end">
                                    <button class="bg-emerald-200 text-emerald-800 px-4 py-2 rounded-2xl font-semibold">Apply</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</div>

<!-- Minimal script to toggle admin collapse because we're not using Bootstrap JS for this template -->
<script>
document.querySelectorAll('[data-bs-toggle="collapse"]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const target = document.querySelector(btn.getAttribute('data-bs-target'));
    if(!target) return;
    target.classList.toggle('hidden');
  })
});
</script>

</body>
</html>
