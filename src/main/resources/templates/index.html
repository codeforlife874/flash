<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Troubleshooter</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container-main {
            max-width: 1000px;
            margin: 50px auto;
        }

        .main-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background: white;
        }

        .header {
            padding: 30px 35px;
            border-bottom: 1px solid #eeeeee;
        }

        .header h1 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: #6c757d;
            margin: 0;
            font-size: 17px;
        }

        .content {
            padding: 35px;
        }

        /* =========================
           PROBLEM SELECTOR
           ========================= */

        .problem-selector {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 35px;
        }

        .problem-selector h4 {
            font-weight: 600;
            margin-bottom: 18px;
        }

        .problem-form {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .problem-form select {
            flex: 1;
            min-height: 48px;
            font-size: 16px;
        }

        .start-button {
            min-height: 48px;
            padding: 0 25px;
            font-size: 16px;
            font-weight: 500;
        }

        /* =========================
           QUESTION
           ========================= */

        .question-card {
            border: 1px solid #e4e7eb;
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
        }

        .section-label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #6c757d;
            margin-bottom: 18px;
        }

        .question-text {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 35px;
        }

        .decision-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .decision-button {
            min-width: 140px;
            padding: 13px 25px;
            font-size: 18px;
            border-radius: 10px;
        }

        /* =========================
           SOLUTION
           ========================= */

        .solution-card {
            border: 1px solid #e4e7eb;
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
        }

        .solution-label {
            color: #198754;
        }

        .solution-text {
            font-size: 23px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .restart-button {
            padding: 11px 25px;
            border-radius: 10px;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            .container-main {
                margin: 20px 12px;
            }

            .header {
                padding: 25px 20px;
            }

            .content {
                padding: 20px;
            }

            .problem-form {
                flex-direction: column;
                align-items: stretch;
            }

            .start-button {
                width: 100%;
            }

            .question-text {
                font-size: 22px;
            }

            .decision-buttons {
                flex-direction: column;
            }

            .decision-button {
                width: 100%;
            }
        }
    </style>
</head>


<body>

<div class="container-main">

    <div class="main-card">

        <!-- =========================
             PAGE HEADER
             ========================= -->

        <div class="header">

            <h1>
                Troubleshooter
            </h1>

            <p>
                Select a problem and follow the questions to find a solution.
            </p>

        </div>


        <div class="content">

            <!-- =========================
                 PROBLEM DROPDOWN
                 ========================= -->

            <div class="problem-selector">

                <h4>
                    Choose a troubleshooting problem
                </h4>

                <form
                    th:action="@{/selectTree}"
                    method="post"
                    class="problem-form">

                    <select
                        name="treeName"
                        class="form-select"
                        required>

                        <!--
                            IMPORTANT:
                            entry.key   = JSON/tree number
                            entry.value = root "text" from that JSON

                            Example:

                            19.json
                            {
                                "text": "Is the phone battery charged?"
                            }

                            Dropdown will display:
                            "Is the phone battery charged?"
                        -->

                        <option
                            th:each="entry : ${availableTreesMap}"
                            th:value="${entry.key}"
                            th:text="${entry.value}"
                            th:selected="${entry.key == activeTree}">
                        </option>

                    </select>

                    <button
                        type="submit"
                        class="btn btn-primary start-button">
                        Start
                    </button>

                </form>

            </div>


            <!-- =========================
                 QUESTION SECTION
                 ========================= -->

            <div
                class="question-card"
                th:if="${isQuestion}">

                <div class="section-label">
                    Question
                </div>

                <div
                    class="question-text"
                    th:text="${node.text}">
                </div>


                <div class="decision-buttons">

                    <!-- YES -->

                    <form
                        th:action="@{/decision}"
                        method="post">

                        <input
                            type="hidden"
                            name="decision"
                            value="yes">

                        <button
                            type="submit"
                            class="btn btn-success decision-button">

                            ✓ Yes

                        </button>

                    </form>


                    <!-- NO -->

                    <form
                        th:action="@{/decision}"
                        method="post">

                        <input
                            type="hidden"
                            name="decision"
                            value="no">

                        <button
                            type="submit"
                            class="btn btn-danger decision-button">

                            ✕ No

                        </button>

                    </form>

                </div>

            </div>


            <!-- =========================
                 SOLUTION SECTION
                 ========================= -->

            <div
                class="solution-card"
                th:if="${isSolution}">

                <div class="section-label solution-label">
                    Solution
                </div>

                <div
                    class="solution-text"
                    th:text="${node.text}">
                </div>

                <a
                    th:href="@{/restart}"
                    class="btn btn-primary restart-button">

                    Start Again

                </a>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
