<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Troubleshooter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { padding-top: 40px; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h3 class="card-title mb-4">Troubleshooter</h3>
                    <p class="lead">[[${node.text}]]</p>

                    <div th:if="${isQuestion}">
                        <form th:action="@{/decision}" method="post" class="d-inline">
                            <input type="hidden" name="decision" value="yes"/>
                            <button class="btn btn-success btn-lg me-2">Yes</button>
                        </form>
                        <form th:action="@{/decision}" method="post" class="d-inline">
                            <input type="hidden" name="decision" value="no"/>
                            <button class="btn btn-danger btn-lg">No</button>
                        </form>
                    </div>

                    <div th:if="${isSolution}">
                        <div class="mb-3">
                            <a th:href="@{/restart}" class="btn btn-primary btn-lg">Restart</a>
                        </div>

                        <!-- Admin: improve solution -->
                        <p>
                            <a class="btn btn-link" data-bs-toggle="collapse" href="#adminExpand" role="button">Improve this Solution (Admin)</a>
                        </p>
                        <div class="collapse" id="adminExpand">
                            <div class="card card-body text-start">
                                <form th:action="@{/admin/expand}" method="post">
                                    <input type="hidden" name="targetLeafId" th:value="${node.id}" />
                                    <div class="mb-3">
                                        <label class="form-label">New Question</label>
                                        <input name="newQuestionText" class="form-control" required />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Yes Outcome (solution text)</label>
                                        <input name="yesSolText" class="form-control" required />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">No Outcome (solution text)</label>
                                        <input name="noSolText" class="form-control" required />
                                    </div>
                                    <button class="btn btn-success">Apply</button>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
