<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Troubleshooter</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .chat-scroll::-webkit-scrollbar { height: 8px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 999px; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="card-title">Troubleshooter</h3>
                        <div>
                            <form th:action="@{/selectTree}" method="post" class="d-flex align-items-center">
                                <label class="me-2 mb-0">Tree:</label>
                                <select name="treeName" class="form-select form-select-sm me-2" style="width:auto;" th:each="t : ${availableTrees}" th:value="${t}" th:text="${t}" th:selected="${t == activeTree}"></select>
                                <button class="btn btn-outline-secondary btn-sm">Load</button>
                            </form>
                        </div>
                    </div>
                    <p class="lead">[[${node.text}]]</p>

                    <div th:if="${isQuestion}">
                        <form th:action="@{/decision}" method="post" class="d-inline">
                            <input type="hidden" name="decision" value="yes"/>
                            <button class="btn btn-success btn-lg me-2">Yes</button>
                        </form>
                        <form th:action="@{/decision}" method="post" class="flex-1">
                            <input type="hidden" name="decision" value="no" />
                            <button class="w-full bg-pink-600/20 text-pink-300 py-3 rounded-2xl font-bold">NO</button>
                        </form>
                    </div>
                </div>

                <!-- Input with autocomplete suggestions -->
                <div class="relative">
                    <form th:action="@{/start}" method="post" id="startForm" class="flex gap-3">
                        <input type="hidden" name="treeName" id="hiddenTreeName" />
                        <input id="searchInput" name="searchInput" autocomplete="off" placeholder="Type to search issues or pick suggestion..." class="flex-1 rounded-2xl p-3 bg-gray-800 text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-400" />
                        <button id="startBtn" type="submit" class="bg-emerald-500 text-gray-900 px-4 py-2 rounded-2xl font-semibold">Load</button>
                    </form>

                    <!-- suggestion dropdown -->
                    <ul id="suggestions" class="absolute left-0 right-0 mt-2 bg-gray-800 border border-gray-700 rounded-xl max-h-56 overflow-auto hidden z-50"></ul>
                </div>

                    <div th:if="${isSolution}">
                        <div class="mb-3">
                            <a th:href="@{/restart}" class="btn btn-primary btn-lg">Restart</a>
                        </div>
                        <p>
                            <a class="btn btn-link" data-bs-toggle="collapse" href="#adminExpand" role="button">Improve this Solution (Admin)</a>
                        </p>
                        <div class="collapse" id="adminExpand">
                            <div class="card card-body text-start">
                                <form th:action="@{/admin/expand}" method="post">
                                    <input type="hidden" name="targetLeafId" th:value="${node.id}" />
                                    <div class="mb-3">
                                        <label class="form-label">New Question</label>
                                        <input name="newQuestionText" class="form-control" required />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Yes Outcome (solution text)</label>
                                        <input name="yesSolText" class="form-control" required />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">No Outcome (solution text)</label>
                                        <input name="noSolText" class="form-control" required />
                                    </div>
                                    <button class="btn btn-success">Apply</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</div>

<!-- Scripts: autocomplete, suggestion rendering, admin toggle -->
<script th:inline="javascript">
/*<![CDATA[*/
    var treeList = /*[[${availableTreesList}]]*/ [];
    var treeMap = /*[[${availableTreesMap}]]*/ {};
/*]]>*/
</script>
<script>
// render suggestions
const input = document.getElementById('searchInput');
const sugg = document.getElementById('suggestions');
const hidden = document.getElementById('hiddenTreeName');
const startForm = document.getElementById('startForm');

function showSuggestions(list) {
    sugg.innerHTML = '';
    if (!list.length) { sugg.classList.add('hidden'); return; }
    list.slice(0,10).forEach(item => {
        const li = document.createElement('li');
        li.className = 'px-4 py-2 hover:bg-gray-700 cursor-pointer text-sm';
        li.textContent = treeMap[item] || item;
        li.addEventListener('click', ()=>{
            // set hidden and submit to start selected tree
            hidden.value = item;
            // submit form with treeName
            const payload = new FormData();
            payload.append('treeName', item);
            fetch(startForm.getAttribute('action'), { method: 'post', body: payload })
                .then(()=> window.location.reload());
        });
        sugg.appendChild(li);
    });
    sugg.classList.remove('hidden');
}

input && input.addEventListener('input', (e)=>{
    const v = e.target.value.trim().toLowerCase();
    if (!v) { sugg.classList.add('hidden'); hidden.value=''; return; }
    const matches = treeList.filter(t => (treeMap[t] || t).toLowerCase().includes(v));
    showSuggestions(matches);
});

// submit Load button: prefer explicit selection; if user typed exact filename, submit
startForm && startForm.addEventListener('submit', (ev)=>{
    if (hidden.value) return; // already set via selection
    ev.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    // find best match
    const match = treeList.find(t=>t.toLowerCase()===v.toLowerCase()) || treeList.find(t=>t.toLowerCase().includes(v.toLowerCase()));
    if (match) {
        const payload = new FormData(); payload.append('treeName', match);
        fetch(startForm.getAttribute('action'), { method: 'post', body: payload })
            .then(()=> window.location.reload());
    }
});

// admin toggle
document.getElementById('adminToggle')?.addEventListener('click', ()=>{
    document.getElementById('adminExpand').classList.toggle('hidden');
});
</script>

</body>
</html>
